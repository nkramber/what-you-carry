# Runs the bit-identity sweep on the three platforms and compares the three hashes (D-69, D-71, D-201, G-9).
# The sweep lives in WhatYouCarry.Tools, command bit-identity. It prints the state hash alone on standard
# output, and its context on standard error, so each job captures the hash with no filter.
#
# The three platform jobs pass their hash up as a job output, and the compare job reads all three. A job output
# needs no artifact action, so this workflow adds no dependency (G-16).
#
# Each platform job also builds and runs the sweep in Release, and it fails when the Release hash is not the Debug
# hash, so no result depends on the optimized code (F-133). The job passes up the Debug hash after that check.
name: Bit identity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer event on a PR cancels the older run of this workflow for that PR, so the one Mac runner serves the newest
# head (D-356, F-99). A push to main takes the group of its own commit, so every merge commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Each job name below is a check name, unique across the workflows, because the ruleset of main requires each
# one by name (D-522). The job id stays short for the needs lists.
jobs:
  # The first job decides whether the heavy jobs skip a head that changes documents alone (D-474, D-475).
  ci-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.ci-skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: ci-skip
        uses: ./.github/actions/ci-skip
        with:
          workflow-file: bit-identity.yml

  linux-x64:
    name: bit-identity-linux-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.sweep.outputs.hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj
      - name: Build Release
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -c Release
      - name: Run the sweep
        id: sweep
        shell: bash
        run: |
          hash="$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bit-identity)"
          release_hash="$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -c Release --no-build -- bit-identity)"
          echo "linux-x64 Debug:   ${hash}"
          echo "linux-x64 Release: ${release_hash}"

          # The optimized build must give the Debug hash, or the result depends on the code generation (F-133).
          if [ -z "${hash}" ] || [ "${hash}" != "${release_hash}" ]; then
            echo "The Release sweep does not give the Debug hash on linux-x64."
            exit 1
          fi

          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: bit-identity-windows-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: windows-latest
    outputs:
      hash: ${{ steps.sweep.outputs.hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj
      - name: Build Release
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -c Release
      - name: Run the sweep
        id: sweep
        # bash on the Windows runner too, so the three jobs use one syntax for the job output.
        shell: bash
        run: |
          hash="$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bit-identity)"
          release_hash="$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -c Release --no-build -- bit-identity)"
          echo "windows-x64 Debug:   ${hash}"
          echo "windows-x64 Release: ${release_hash}"

          # The optimized build must give the Debug hash, or the result depends on the code generation (F-133).
          if [ -z "${hash}" ] || [ "${hash}" != "${release_hash}" ]; then
            echo "The Release sweep does not give the Debug hash on windows-x64."
            exit 1
          fi

          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

  macos-arm64:
    name: bit-identity-macos-arm64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: [self-hosted, macos-arm64-self-hosted]
    outputs:
      hash: ${{ steps.sweep.outputs.hash }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj
      - name: Build Release
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -c Release
      - name: Run the sweep
        id: sweep
        shell: bash
        run: |
          hash="$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bit-identity)"
          release_hash="$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -c Release --no-build -- bit-identity)"
          echo "macos-arm64 Debug:   ${hash}"
          echo "macos-arm64 Release: ${release_hash}"

          # The optimized build must give the Debug hash, or the result depends on the code generation (F-133).
          if [ -z "${hash}" ] || [ "${hash}" != "${release_hash}" ]; then
            echo "The Release sweep does not give the Debug hash on macos-arm64."
            exit 1
          fi

          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

  compare:
    name: bit-identity-compare
    needs: [ci-skip, linux-x64, windows-x64, macos-arm64]
    # The compare job skips with the three platform jobs. An empty hash below fails it when a platform job fails (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Compare the three hashes
        shell: bash
        env:
          LINUX_HASH: ${{ needs.linux-x64.outputs.hash }}
          WINDOWS_HASH: ${{ needs.windows-x64.outputs.hash }}
          MACOS_HASH: ${{ needs.macos-arm64.outputs.hash }}
        run: |
          echo "linux-x64:   ${LINUX_HASH}"
          echo "windows-x64: ${WINDOWS_HASH}"
          echo "macos-arm64: ${MACOS_HASH}"

          # An empty hash means a job gave no output. That is a failure and never a pass (T-2).
          for name in LINUX_HASH WINDOWS_HASH MACOS_HASH; do
            if [ -z "${!name}" ]; then
              echo "The job for ${name} produced no hash."
              exit 1
            fi
          done

          if [ "${LINUX_HASH}" != "${WINDOWS_HASH}" ] || [ "${LINUX_HASH}" != "${MACOS_HASH}" ]; then
            echo "The three platforms do not agree. The simulation is not bit-identical (G-9)."
            exit 1
          fi

          echo "The three platforms agree on ${LINUX_HASH}."
