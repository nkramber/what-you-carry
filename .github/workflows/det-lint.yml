# Scans the Core source for the banned symbols of G-2 and G-21 (D-67, D-202).
# The rules live in WhatYouCarry.Tools, command det-lint. A finding fails the job.
# One platform is enough: the tool parses source text, and the parse does not depend on the machine.
name: Determinism lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer event on a PR cancels the older run of this workflow for that PR, so the one Mac runner serves the newest
# head (D-356, F-99). A push to main takes the group of its own commit, so every merge commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  det-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Scan the Core source
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -- det-lint --root .
