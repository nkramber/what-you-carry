# Build and test on three platforms, each on a GitHub-hosted runner (D-71, D-148, D-572). The test jobs skip a head
# that changes documents alone (D-474), and the documents job runs on each head (D-476).
# The Linux and Windows legs run their tests in two jobs: the Sweep category, and every other test (D-479). The macOS
# leg keeps one job, so the check names that the ruleset of main requires stay as they are (D-522, D-573).
# The SDK comes from actions/setup-dotnet and global.json on every platform (D-189).
# The test of the Smoke category starts the engine, and these jobs hold none, so the smoke workflow runs it (PR-12).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request runs one fifth of each seed sweep, and a push to main runs the full count (D-480, D-481).
env:
  WYC_PR_SWEEP: ${{ github.event_name == 'pull_request' && '1' || '0' }}

# A newer event on a PR cancels the older run of this workflow for that PR, so each runner serves the newest head
# (D-356, F-99). A push to main takes the group of its own commit, so every merge commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Each job name below is a check name, unique across the workflows, because the ruleset of main requires each
# one by name (D-522). The job id stays short for the needs lists.
jobs:
  # The first job decides whether the heavy jobs skip a head that changes documents alone (D-474, D-475).
  ci-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.ci-skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: ci-skip
        uses: ./.github/actions/ci-skip
        with:
          workflow-file: ci.yml

  # The tests that read a document of the checkout run on each head, and a skip of the test jobs below never
  # skips them (D-476). The test jobs run them too.
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Test the documents
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Documents"

  linux-x64:
    name: ci-linux-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Test
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category!=Smoke&Category!=Sweep"

  linux-x64-sweeps:
    name: ci-linux-x64-sweeps
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Test
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Sweep"

  windows-x64:
    name: ci-windows-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Test
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category!=Smoke&Category!=Sweep"

  windows-x64-sweeps:
    name: ci-windows-x64-sweeps
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Test
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Sweep"

  macos-arm64:
    name: ci-macos-arm64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: macos-latest
    steps:
      # The label macos-latest names no architecture, so the job proves the arm64 runner first (D-572, D-583, T-2).
      - name: Check the architecture
        shell: bash
        run: |
          arch="$(uname -m)"
          if [ "${arch}" != "arm64" ]; then
            echo "The macOS leg needs an arm64 runner, and macos-latest gave ${arch} (D-572, D-583)."
            exit 1
          fi
          echo "The macOS leg runs on ${arch}."
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Test
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category!=Smoke"
