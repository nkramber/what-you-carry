# Plays one hundred headless bot runs per policy on every PR (D-115, D-127; PR-11 exit test 5, PR-16 exit test 7, D-421, D-434).
# A crash, or a softlock on a policy that promises progress, fails the job. A death is its own end state, and it
# fails no job, because a fight can kill a bot (D-403). The night workflow plays the long runs (D-177).
name: Bots

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer event on a PR cancels the older run of this workflow for that PR, so the one Mac runner serves the newest
# head (D-356, F-99). A push to main takes the group of its own commit, so every merge commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj
      - name: Random walker, one hundred seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy random-walker --seeds 1-100 --output bot-logs --root .
      - name: Greedy descender, one hundred seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy greedy-descender --seeds 1-100 --output bot-logs --root .
      - name: Full clearer, one hundred seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy full-clearer --seeds 1-100 --output bot-logs --root .
      - name: Timer tester, one hundred seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy timer-tester --seeds 1-100 --output bot-logs --root .
      - name: Coward, one hundred seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy coward --seeds 1-100 --output bot-logs --root .
