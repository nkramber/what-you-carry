# Publishes the review-gate check run on the PR head (D-179, D-181, D-184, D-185, D-190, D-197).
# The rules live in WhatYouCarry.Tools, command review-gate. This file only gathers the inputs and posts the result.
#
# The event is pull_request_target, so GitHub runs this file and the tool from the base branch (D-197).
# The PR head is data only. The job fetches it into the git object store and never checks it out.
# The tool reads the head through git. A PR cannot change the code that judges it.
#
# The check run keeps its three conclusions (D-181). The job passes on success alone, so the job line in the PR
# rollup reads red on a neutral verdict too (D-251).
name: Review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check out the base branch
        # No ref input: on pull_request_target the default ref is the base branch (D-197).
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the PR head as data
        # The head commits enter the object store under a remote ref. The working tree stays on the base branch.
        run: |
          git fetch origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}"
          echo "base: $(git rev-parse HEAD)"
          echo "head: ${HEAD_SHA}"

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Read the labels and the override label events
        # The timeline gives every labeled event for review-override. The tool takes the newest one (D-190).
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '[.labels[].name]' > labels.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/timeline" \
            --jq '.[] | select(.event == "labeled" and .label.name == "review-override") | {createdAt: .created_at, actor: .actor.login}' \
            | jq --slurp '.' > override-label-events.json

      - name: Write the request
        run: |
          jq --null-input \
            --arg repositoryPath "$GITHUB_WORKSPACE" \
            --argjson pullRequestNumber "$PR_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            --arg baseRef "origin/${BASE_REF}" \
            --slurpfile labels labels.json \
            --slurpfile overrideLabelEvents override-label-events.json \
            '{repositoryPath: $repositoryPath, pullRequestNumber: $pullRequestNumber, headSha: $headSha, baseRef: $baseRef, labels: $labels[0], overrideLabelEvents: $overrideLabelEvents[0]}' \
            > request.json
          cat request.json

      - name: Evaluate the rules with the base-branch tool
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj -- review-gate --input request.json --output check-run.json

      - name: Publish the check run
        run: |
          cat check-run.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input check-run.json --jq '{id, name, conclusion, html_url}'

      - name: Fail the job unless the verdict is success
        # A job cannot set a neutral conclusion by its exit code, so the job fails on neutral too. The visible
        # job line then reads red until a review record or a valid override label exists (D-251, F-84).
        # The guard reads success alone, so a missing or unexpected conclusion fails the job and never passes
        # it in silence (T-2).
        run: |
          conclusion="$(jq --raw-output '.conclusion' check-run.json)"
          echo "review-gate conclusion: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            jq --raw-output '.output.summary' check-run.json
            exit 1
          fi
