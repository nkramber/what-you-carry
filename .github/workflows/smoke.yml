# Runs the tests of the Smoke category on the three platforms (D-114, D-149, D-306; PR-12 exit tests 4 and 5).
# Each job takes the pinned Godot .NET binary of D-61 from the actions cache, or downloads it from the GitHub
# release on a miss, builds the solution, and runs the Smoke category. The first test starts the engine headless
# with the --smoke flag on the built Game assembly, and it reads the exit code and the log. The second starts it
# headless with the --contact-sheet flag and expects exit code 1, because the headless display renders no image.
# The three CI jobs leave that category to this workflow, because they hold no engine. The Windows job names
# the console executable, because the window executable writes nothing to standard output.
name: Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable
  # The SHA-512 of each zip, from the SHA512-SUMS.txt of the release and a local download of 2026-09-26 (D-626). A new
  # version changes the three values. The cache key holds the value, so the cache keeps only a checked binary.
  GODOT_SHA512_LINUX: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
  GODOT_SHA512_WINDOWS: 79229fd112b0c9cbeab82363a4ef7be18ea70f1caf86bf912789335b136fbe7e01db0053a33461438c5da1c680c17bbb10040bd09bedc51221cd4423d0367757
  GODOT_SHA512_MACOS: 0862c53d7158c7a67f745e2e46f90b68cf5343cbe8b95d6d4333c469e42ca104af9c121d1746a50e5d221a99d09d82ef7016495f8e0d09255842884ed0502795

# A newer event on a PR cancels the older run of this workflow for that PR, so each runner serves the newest head
# (D-356, F-99). A push to main takes the group of its own commit, so every merge commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Each job name below is a check name, unique across the workflows, because the ruleset of main requires each
# one by name (D-522). The job id stays short for the needs lists.
jobs:
  # The first job decides whether the heavy jobs skip a head that changes documents alone (D-474, D-475).
  ci-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.ci-skip.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: ci-skip
        uses: ./.github/actions/ci-skip
        with:
          workflow-file: smoke.yml

  linux-x64:
    name: smoke-linux-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Restore the Godot binary
        id: godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64-${{ env.GODOT_SHA512_LINUX }}
      - name: Download the Godot binary
        if: steps.godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --fail -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          echo "${GODOT_SHA512_LINUX}  godot.zip" | sha512sum -c -
          unzip -q godot.zip -d godot
          rm godot.zip
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Smoke session
        env:
          WYC_GODOT: ${{ github.workspace }}/godot/Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}_mono_linux.x86_64
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Smoke"

  windows-x64:
    name: smoke-windows-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Restore the Godot binary
        id: godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-win64-${{ env.GODOT_SHA512_WINDOWS }}
      - name: Download the Godot binary
        if: steps.godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_mono_win64.zip" -OutFile godot.zip
          $hash = (Get-FileHash -Path godot.zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($hash -ne $env:GODOT_SHA512_WINDOWS) { throw "The SHA-512 of godot.zip is $hash, and D-626 pins $env:GODOT_SHA512_WINDOWS." }
          Expand-Archive -Path godot.zip -DestinationPath godot
          Remove-Item godot.zip
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Smoke session
        env:
          WYC_GODOT: ${{ github.workspace }}/godot/Godot_v${{ env.GODOT_VERSION }}_mono_win64/Godot_v${{ env.GODOT_VERSION }}_mono_win64_console.exe
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Smoke"

  macos-arm64:
    name: smoke-macos-arm64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: macos-latest
    steps:
      # The label macos-latest names no architecture, so the job proves the arm64 runner first (D-572, D-583, T-2).
      - name: Check the architecture
        shell: bash
        run: |
          arch="$(uname -m)"
          if [ "${arch}" != "arm64" ]; then
            echo "The macOS leg needs an arm64 runner, and macos-latest gave ${arch} (D-572, D-583)."
            exit 1
          fi
          echo "The macOS leg runs on ${arch}."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Restore the Godot binary
        id: godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-macos-universal-${{ env.GODOT_SHA512_MACOS }}
      - name: Download the Godot binary
        if: steps.godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL --fail -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip"
          echo "${GODOT_SHA512_MACOS}  godot.zip" | shasum -a 512 -c -
          unzip -q godot.zip -d godot
          rm godot.zip
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Smoke session
        env:
          WYC_GODOT: ${{ github.workspace }}/godot/Godot_mono.app/Contents/MacOS/Godot
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Smoke"
