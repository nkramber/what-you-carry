# Runs the tests of the Smoke category on the three platforms (D-114, D-149, D-306; PR-12 exit tests 4 and 5).
# Each job takes the pinned Godot .NET binary of D-61 from the actions cache, or downloads it from the GitHub
# release on a miss, builds the solution, and runs the Smoke category. The first test starts the engine headless
# with the --smoke flag on the built Game assembly, and it reads the exit code and the log. The second starts it
# headless with the --contact-sheet flag and expects exit code 1, because the headless display renders no image.
# The three CI jobs leave that category to this workflow, because they hold no engine. The Windows job names
# the console executable, because the window executable writes nothing to standard output.
name: Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

# A newer event on a PR cancels the older run of this workflow for that PR, so the one Mac runner serves the newest
# head (D-356, F-99). A push to main takes the group of its own commit, so every merge commit keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# Each job name below is a check name, unique across the workflows, because the ruleset of main requires each
# one by name (D-522). The job id stays short for the needs lists.
jobs:
  # The first job decides whether the heavy jobs skip a head that changes documents alone (D-474, D-475).
  ci-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.ci-skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: ci-skip
        uses: ./.github/actions/ci-skip
        with:
          workflow-file: smoke.yml

  linux-x64:
    name: smoke-linux-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore the Godot binary
        id: godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Download the Godot binary
        if: steps.godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q godot.zip -d godot
          rm godot.zip
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Smoke session
        env:
          WYC_GODOT: ${{ github.workspace }}/godot/Godot_v${{ env.GODOT_VERSION }}_mono_linux_x86_64/Godot_v${{ env.GODOT_VERSION }}_mono_linux.x86_64
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Smoke"

  windows-x64:
    name: smoke-windows-x64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore the Godot binary
        id: godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-win64
      - name: Download the Godot binary
        if: steps.godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v$($env:GODOT_VERSION)_mono_win64.zip" -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath godot
          Remove-Item godot.zip
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Smoke session
        env:
          WYC_GODOT: ${{ github.workspace }}/godot/Godot_v${{ env.GODOT_VERSION }}_mono_win64/Godot_v${{ env.GODOT_VERSION }}_mono_win64_console.exe
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Smoke"

  macos-arm64:
    name: smoke-macos-arm64
    needs: ci-skip
    # A skipped job reports success to a required check. A fault in ci-skip gives no output, and the job runs (T-2).
    if: ${{ !cancelled() && needs.ci-skip.outputs.skip != 'true' }}
    runs-on: [self-hosted, macos-arm64-self-hosted]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore the Godot binary
        id: godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-macos-universal
      - name: Download the Godot binary
        if: steps.godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip"
          unzip -q godot.zip -d godot
          rm godot.zip
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Smoke session
        env:
          WYC_GODOT: ${{ github.workspace }}/godot/Godot_mono.app/Contents/MacOS/Godot
        run: dotnet test WhatYouCarry.slnx --no-build --filter "Category=Smoke"
