# The scheduled night on hosted Linux, as parallel jobs (D-115, D-116, D-117, D-177, D-572, D-573; PR-11 exit tests 6
# and 7, PR-85). It runs at 07:07 UTC, which is 01:07 Central Standard Time and 02:07 Central Daylight Time (D-571).
# The cron reads UTC alone, and the minute stays off the start of the hour, because GitHub delays or drops a schedule
# there under load (D-285). The 03:00 UTC run of 2026-09-11 never came (F-94), and the 08:07 UTC run of that day started
# 4 h 40 min late, at 12:47 UTC (F-95).
# Five thousand bot runs per policy, and the reachability sweep of PR-9 at one hundred thousand seeds. These fixed
# seeds stay the gate, and each night also runs a slice past them, which the UTC date of the night start selects
# (D-564, D-566). The seeds of each sweep also hold the extra fixed seeds of the checkout, and the failed seeds that the
# record of main carries until a night passes them (D-567). A failed seed of a slice fails the night (D-565).
# The plan job takes the date and the record of main one time, so each sweep reads the same pair. The sweep job runs
# one shard of one sweep of NightSeeds.Sweeps on each leg, and a hosted job stops at 6 hours (D-572). The sweeps
# full-clearer and reachability each run as two shards, and each other sweep as one (D-655). Each leg keeps its summary
# line and its failure line as a run artifact, and the lines of a shard name the shard. The record job writes
# night.json with the commit, the end time, the status, and the death and ascend counts of each bot policy, and the
# publish step reads the record of main at publish time, so no failed seed of it is lost (D-648). The record goes to
# the orphan branch night-results, which holds that one file
# (D-273). When the build itself fails, the publish step writes the failure record in shell, so the branch never keeps
# a stale success. PR-58 adds the gate that reads it. Of the nights, only a night on main writes night-results (D-373).
# A night on another branch writes its record to the orphan branch night-branch/<branch>, so it cannot replace the
# record of main that the night-gate job reads, and the gate of the PR of that branch reads it (D-538; PR-81). That
# night then re-runs the newest night-gate run of its branch, so the check of the PR reads the new record (D-548). A
# night on main re-runs the newest night-gate run of each open PR, because every PR reads its record (D-559). The
# workflow night-promote.yml also writes night-results, at a merge commit that a branch night tested (D-557). A night on
# a tag writes no record. A failed sweep keeps its bot logs as a run artifact, because the runner is gone after the job
# (D-280). A failed night on main sends a Pushover notification to the owner at priority 1, through the job notify
# (D-642).
name: Night

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:

# D-648: a new night on a ref waits for the night in progress on that ref, so two nights never publish at once, and
# neither loses a failed seed of the other. No run is cancelled in progress, because the night gate fails a cancelled
# night record (D-274, D-356). GitHub keeps one waiting run in a group, so a third night replaces the waiting one
# before it starts, and a night that never started writes no record.
concurrency:
  group: night-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Plan the seeds
        # D-564 to D-567: the UTC date of the night start selects the slice of every sweep. The record of main names the
        # failed seeds that this night carries. A night on a branch carries the seeds of main too, so its promotion
        # proves them (D-569).
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          git fetch --quiet origin refs/heads/night-results
          git show FETCH_HEAD:night.json > "${RUNNER_TEMP}/main-night.json"
      - name: Keep the record of main for each job
        # A re-run of this job uploads the record again under the same name, and that upload replaces the artifact of
        # the earlier attempt, as the sweep uploads do (F-155).
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-night
          path: ${{ runner.temp }}/main-night.json
          if-no-files-found: error
          overwrite: true

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      # One failed sweep does not stop the others, so the record names the failed seeds of each sweep (D-567).
      fail-fast: false
      matrix:
        # The sweeps of NightSeeds.Sweeps, in its order, with each shard of NightSeeds.ShardCount (D-655). The timer
        # tester waits through each expiry, so every run lasts at least three minutes of simulated time (D-426). The
        # coward ascends at the first stairwell, so each run lasts one floor (D-434). On 2026-09-26 and 2026-09-27 the
        # reachability job took 149 and 150 minutes, and the full-clearer job 82 and 131 minutes, so each runs as two
        # shards, and a sweep ends when both of its shards end.
        include:
          - {sweep: random-walker, shard: 1}
          - {sweep: greedy-descender, shard: 1}
          - {sweep: full-clearer, shard: 1}
          - {sweep: full-clearer, shard: 2}
          - {sweep: timer-tester, shard: 1}
          - {sweep: coward, shard: 1}
          - {sweep: reachability, shard: 1}
          - {sweep: reachability, shard: 2}
    env:
      SWEEP: ${{ matrix.sweep }}
      SHARD: ${{ matrix.shard }}
      NIGHT_DATE: ${{ needs.plan.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the sweep result
        # The result holds the summary line and the failure line of this sweep. An empty failure file means that the
        # sweep did not end (D-567). The step comes before the build, so a broken build still leaves a result.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sweep"
          : > "${RUNNER_TEMP}/sweep/bot-deaths.txt"
          : > "${RUNNER_TEMP}/sweep/seed-failures.txt"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Take the record of main from the plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-night
          path: ${{ runner.temp }}
      - name: List the seeds of the sweep
        # The list goes to a file, and each sweep reads the file. Linux caps one argument or one variable at 131072
        # bytes, and a list of many carried seeds passes that (F-162). The list is the part of the shard of this leg,
        # and shard 1 also runs each extra seed and each carried seed (D-655).
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep "$SWEEP" --shard "$SHARD" --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json" > "${RUNNER_TEMP}/night-seeds.txt"
          echo "NIGHT_SEEDS_FILE=${RUNNER_TEMP}/night-seeds.txt" >> "$GITHUB_ENV"
      - name: Bot sweep, the fixed seeds and the slice
        if: matrix.sweep != 'reachability'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy "$SWEEP" --seeds-file "$NIGHT_SEEDS_FILE" --output bot-logs --root . --summary "${RUNNER_TEMP}/sweep/bot-deaths.txt" --failures "${RUNNER_TEMP}/sweep/seed-failures.txt" --shard "$SHARD"
      - name: Seed sweep, the fixed seeds and the slice
        if: matrix.sweep == 'reachability'
        shell: bash
        env:
          WYC_NIGHT_SWEEP: "1"
          WYC_NIGHT_FAILURES: ${{ runner.temp }}/sweep/seed-failures.txt
          WYC_NIGHT_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          WYC_NIGHT_SEEDS_FILE="$NIGHT_SEEDS_FILE"
          export WYC_NIGHT_SEEDS_FILE
          dotnet test WhatYouCarry.slnx --no-build --filter "FullyQualifiedName~EveryChamberReachable|FullyQualifiedName~DetailKeepsEveryChamberReachable"
      - name: Keep the bot logs of a failed night
        # The crash text of a failed run lives in its log alone, and the runner is gone after the job (D-280). A sweep
        # that fails before its runs, or the seed sweep, has no logs, and the step says so instead of failing in silence.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bot-logs-${{ matrix.sweep }}-${{ matrix.shard }}
          path: bot-logs
          if-no-files-found: warn
          overwrite: true
      - name: Keep the sweep result for the record
        # A re-run of the failed jobs of a night runs this shard again, and its result replaces the result of the
        # earlier attempt, so the record reads the newest attempt. Each shard has an artifact name of its own (D-655).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: night-sweep-${{ matrix.sweep }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/sweep/
          if-no-files-found: error
          overwrite: true

  record:
    needs: [plan, sweep]
    # A night on a tag writes no record (D-538). A failed or cancelled sweep still gets its record.
    if: always() && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: read
    outputs:
      # The status of the night record, which the job notify reads (D-642).
      status: ${{ steps.gather.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The order check of a night on main asks git whether the record of main comes after the night commit (D-562).
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Build
        id: build
        run: dotnet build WhatYouCarry.Tools/WhatYouCarry.Tools.csproj
      - name: Take the record of main from the plan
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: main-night
          path: ${{ runner.temp }}
      - name: Take the result of each sweep
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: night-sweep-*
          path: ${{ runner.temp }}/sweeps
      - name: Gather the sweep results
        # Each shard result adds its summary line and its failure line, and night-record joins the lines of the shards
        # of one sweep (D-655). The status reads the plan, every sweep, and the steps of this job before it (D-177).
        id: gather
        if: always()
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          RECORD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sweeps"
          status=$(bash .github/scripts/night-gather.sh "${RUNNER_TEMP}/sweeps" "${RUNNER_TEMP}" "$PLAN_RESULT" "$SWEEP_RESULT" "$RECORD_STATUS")
          echo "NIGHT_STATUS=${status}" >> "$GITHUB_ENV"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
      - name: Write the night record
        if: always()
        env:
          NIGHT_DATE: ${{ needs.plan.outputs.date }}
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-record --commit "${GITHUB_SHA}" --status "${NIGHT_STATUS}" --output "${RUNNER_TEMP}/night.json" --summary "${RUNNER_TEMP}/bot-deaths.txt" --date "${NIGHT_DATE}" --failures "${RUNNER_TEMP}/seed-failures.txt" --carry "${RUNNER_TEMP}/main-night.json"
      - name: Publish the night record
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          # Only main writes the record that every PR reads (D-373). Another branch writes a record of its own (D-538).
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            target="night-results"
          else
            target="night-branch/${GITHUB_REF_NAME}"
          fi
          # The lease: the record of main as this step reads it, taken before any read of the record itself. Each read
          # below reads the commit of the lease, and the push takes the lease, so a promotion or a night that writes in
          # between fails the push, and no failed seed of its record is lost (D-648).
          lease=""
          if [ "$target" = "night-results" ]; then
            lease=$(git ls-remote origin refs/heads/night-results | cut -f1)
          fi
          # A broken build leaves no binary for night-record. A script writes the failure record, and it keeps the
          # failed seeds of the record of main at publish time, so the carry survives (D-567, D-648, PR #100 review P1-1).
          if [ ! -f "${RUNNER_TEMP}/night.json" ]; then
            git fetch --quiet origin refs/heads/night-results
            if [ "$target" = "night-results" ] && [ "$(git rev-parse FETCH_HEAD)" != "$lease" ]; then
              echo "The record of main moved from the lease '${lease}' while this step read it. A re-run of this job reads the new record (D-648)."
              exit 1
            fi
            git show FETCH_HEAD:night.json > "${RUNNER_TEMP}/main-night-now.json"
            bash .github/scripts/night-failure-record.sh "${GITHUB_SHA}" "${RUNNER_TEMP}/main-night-now.json" "${RUNNER_TEMP}/night.json"
          fi
          publish="${RUNNER_TEMP}/night.json"
          fail_after_push="false"
          if [ "$target" = "night-results" ]; then
            # The record of main at publish time decides the record that this night writes (D-562, D-648). A record at
            # a later commit stays, unless this night failed a seed that it does not name. Each failed seed of the
            # record of main that this night did not run stays in the record that the step writes.
            if [ "$BUILD_OUTCOME" = "success" ]; then
              git fetch --quiet origin main
              set +e
              dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-publish-check --root . --remote origin --commit "${GITHUB_SHA}" --lease "$lease" --night "${RUNNER_TEMP}/night.json" --failures "${RUNNER_TEMP}/seed-failures.txt" --output "${RUNNER_TEMP}/night-publish.json"
              rc=$?
              set -e
              # The exit codes of night-publish-check: 0 publish its output, 1 keep the record of main (D-562), 3 a git
              # fault or a moved lease, so no push, and 4 bad inputs of this night.
              if [ "$rc" -eq 1 ]; then
                echo "This night writes no record. Its result stays in this run."
                exit 0
              fi
              if [ "$rc" -eq 4 ]; then
                # Fail closed (T-2, D-565, D-648): the inputs of this night are bad, so the failure record of this night
                # replaces the record of main. It keeps the failed seeds of the record of main at the lease, the push
                # takes the lease, and the job fails after the push, so the fault shows.
                if [ -n "$lease" ]; then
                  git show "${lease}:night.json" > "${RUNNER_TEMP}/main-night-lease.json"
                else
                  echo "{}" > "${RUNNER_TEMP}/main-night-lease.json"
                fi
                bash .github/scripts/night-failure-record.sh "${GITHUB_SHA}" "${RUNNER_TEMP}/main-night-lease.json" "${RUNNER_TEMP}/night-publish.json"
                fail_after_push="true"
                rc=0
              fi
              if [ "$rc" -ne 0 ]; then
                echo "The night-publish-check command exited ${rc}, and the step pushes no record."
                exit "$rc"
              fi
              publish="${RUNNER_TEMP}/night-publish.json"
            else
              echo "The build left no binary for the publish check, so the failure record of this night replaces the record of main."
            fi
          fi
          # The commit names the status of the file that it writes, which the failure record script can set.
          status=$(jq -r '.status' "$publish")
          work="${RUNNER_TEMP}/night-results"
          rm -rf "$work"
          git worktree add --detach "$work" HEAD
          cd "$work"
          git checkout --orphan "$target"
          git rm -rfq .
          cp "$publish" night.json
          git config user.name "night job"
          git config user.email "night-job@users.noreply.github.com"
          git add night.json
          git commit -qm "night: ${GITHUB_SHA} ${status}"
          if [ "$target" = "night-results" ]; then
            git push --force-with-lease="refs/heads/night-results:${lease}" origin "HEAD:refs/heads/${target}"
          else
            git push --force origin "HEAD:refs/heads/${target}"
          fi
          if [ "$fail_after_push" = "true" ]; then
            echo "The inputs of this night were bad, so its failure record replaced the record of main, and the job fails (T-2, D-565)."
            exit 1
          fi
      - name: Re-run the night gate of the branch
        # The night-gate check of a PR runs on a pull_request event, so a night that ends later re-runs its newest run
        # (D-548). A run that has not ended reads the new record when it runs. A branch with no PR has no such run.
        if: always() && github.ref != 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow night-gate.yml --branch "$GITHUB_REF_NAME" --event pull_request --limit 1 --json databaseId,status --jq '.[] | "\(.databaseId) \(.status)"')
          if [ -z "$run" ]; then
            echo "The branch ${GITHUB_REF_NAME} has no night-gate run, so no PR check reads this record yet."
            exit 0
          fi
          id="${run%% *}"
          state="${run#* }"
          if [ "$state" != "completed" ]; then
            echo "The night-gate run ${id} is ${state}, so it reads the new record when it runs."
            exit 0
          fi
          gh run rerun "$id" --repo "$GITHUB_REPOSITORY"
          echo "The night-gate run ${id} runs again, and it reads the record of this night."
      - name: Re-run the night gate of each open PR
        # Every PR reads the record of main, so a night on main re-runs the newest night-gate run of each open PR (D-559).
        if: always() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/rerun-night-gates

  notify:
    # A failed night on main sends a Pushover notification to the owner (D-642): a job that did not succeed, or a
    # record with the status failure. A night on another branch sends none. The two keys are repository secrets and
    # never appear in a file. A failed send fails this job with the HTTP answer, so a broken notification shows on the
    # run (T-2). The night record and the gates do not read this job.
    needs: [plan, sweep, record]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.plan.result != 'success' || needs.sweep.result != 'success' || needs.record.result != 'success' ||
      needs.record.outputs.status != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send the Pushover notification
        uses: ./.github/actions/pushover
        with:
          user-key: ${{ secrets.PUSHOVER_USER_KEY }}
          api-token: ${{ secrets.PUSHOVER_API_TOKEN }}
          title: "What You Carry: the night failed"
          message: "The night on main failed at ${{ github.sha }}. Plan ${{ needs.plan.result }}, sweeps ${{ needs.sweep.result }}, record ${{ needs.record.result }}, status ${{ needs.record.outputs.status }}. The night fixer on the Mac Mini starts within 15 minutes (D-643)."
          priority: "1"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
