# The scheduled night on the self-hosted macOS runner (D-115, D-116, D-117, D-157, D-177; PR-11 exit tests 6 and 7).
# It runs at 08:07 UTC, which is 02:07 Central Standard Time and 03:07 Central Daylight Time (D-284, D-285, D-288).
# The cron reads UTC alone, and the minute stays off the start of the hour, because GitHub delays or drops a schedule
# there under load. The 03:00 UTC run of 2026-09-11 never came (F-94), and the 08:07 UTC run of that day started
# 4 h 40 min late, at 12:47 UTC (F-95).
# Five thousand bot runs per policy, and the reachability sweep of PR-9 at one hundred thousand seeds. The last
# two steps write night.json with the commit, the end time, the status, and the death count of each bot policy,
# to the orphan branch night-results, which holds that one file (D-273). When the build itself fails, the
# publish step writes the failure record in shell, so the branch never keeps a stale success. PR-58 adds the
# gate that reads it. The two record steps run on main alone (D-373). A night on another ref runs in full and
# writes no record, so it cannot replace the record of main that the night-gate job reads. Such a night proves a
# fix through its run log alone. A failed night keeps its bot logs as a run artifact, because the runner checkout
# cleans them at its next job (D-280).
name: Night

on:
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  night:
    runs-on: [self-hosted, macos-arm64-self-hosted]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build WhatYouCarry.slnx
      - name: Start the bot summary
        # The runner empties its temp directory between jobs, and an explicit remove keeps a stale file out of the
        # record whatever the runner does (D-403).
        run: rm -f "${RUNNER_TEMP}/bot-deaths.txt"
      - name: Random walker, five thousand seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy random-walker --seeds 1-5000 --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt"
      - name: Greedy descender, five thousand seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy greedy-descender --seeds 1-5000 --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt"
      - name: Full clearer, five thousand seeds
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy full-clearer --seeds 1-5000 --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt"
      - name: Reachability sweep, one hundred thousand seeds
        env:
          WYC_NIGHT_SWEEP: "1"
        run: dotnet test WhatYouCarry.slnx --no-build --filter "FullyQualifiedName~EveryChamberReachable|FullyQualifiedName~DetailKeepsEveryChamberReachable"
      - name: Keep the bot logs of a failed night
        # The crash text of a failed run lives in its log alone, and the next job on the runner cleans the directory (D-280).
        # A night that fails before the bot steps has no logs, and the step says so instead of failing in silence.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: bot-logs
          if-no-files-found: warn
      - name: Write the night record
        if: always() && github.ref == 'refs/heads/main'
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-record --commit "${GITHUB_SHA}" --status "${{ job.status }}" --output "${RUNNER_TEMP}/night.json" --summary "${RUNNER_TEMP}/bot-deaths.txt"
      - name: Publish the night record
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          # A broken build leaves no binary for night-record, so the shell writes the failure record itself.
          if [ ! -f "${RUNNER_TEMP}/night.json" ]; then
            printf '{"commit":"%s","endedAt":"%s","status":"failure"}\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${RUNNER_TEMP}/night.json"
          fi
          work="${RUNNER_TEMP}/night-results"
          rm -rf "$work"
          git worktree add --detach "$work" HEAD
          cd "$work"
          git checkout --orphan night-results
          git rm -rfq .
          cp "${RUNNER_TEMP}/night.json" night.json
          git config user.name "night job"
          git config user.email "night-job@users.noreply.github.com"
          git add night.json
          git commit -qm "night: ${GITHUB_SHA} ${{ job.status }}"
          git push --force origin night-results
