# The scheduled night on the self-hosted macOS runner (D-115, D-116, D-117, D-157, D-177; PR-11 exit tests 6 and 7).
# It runs at 08:07 UTC, which is 02:07 Central Standard Time and 03:07 Central Daylight Time (D-284, D-285, D-288).
# The cron reads UTC alone, and the minute stays off the start of the hour, because GitHub delays or drops a schedule
# there under load. The 03:00 UTC run of 2026-09-11 never came (F-94), and the 08:07 UTC run of that day started
# 4 h 40 min late, at 12:47 UTC (F-95).
# Five thousand bot runs per policy, and the reachability sweep of PR-9 at one hundred thousand seeds. These fixed
# seeds stay the gate, and each night also runs a slice past them, which the UTC date of the night start selects
# (D-564, D-566). The seeds of each step also hold the extra fixed seeds of the checkout, and the failed seeds that the
# record of main carries until a night passes them (D-567). A failed seed of a slice fails the night (D-565). The last
# two steps write night.json with the commit, the end time, the status, and the death and ascend counts of each bot policy,
# to the orphan branch night-results, which holds that one file (D-273). When the build itself fails, the
# publish step writes the failure record in shell, so the branch never keeps a stale success. PR-58 adds the
# gate that reads it. Of the nights, only a night on main writes night-results (D-373). A night on another branch writes its
# record to the orphan branch night-branch/<branch>, so it cannot replace the record of main that the night-gate
# job reads, and the gate of the PR of that branch reads it (D-538; PR-81). That night then re-runs the newest
# night-gate run of its branch, so the check of the PR reads the new record (D-548). A night on main re-runs the
# newest night-gate run of each open PR, because every PR reads its record (D-559). The workflow night-promote.yml
# also writes night-results, at a merge commit that a branch night tested (D-557). A night on a tag writes no
# record. A failed night keeps its bot logs as a run artifact, because the runner checkout cleans them at its
# next job (D-280).
name: Night

on:
  schedule:
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  night:
    runs-on: [self-hosted, macos-arm64-self-hosted]
    steps:
      - uses: actions/checkout@v5
        with:
          # The order check of a night on main asks git whether the record of main comes after the night commit (D-562).
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        id: build
        run: dotnet build WhatYouCarry.slnx
      - name: Start the bot summary
        # The runner empties its temp directory between jobs, and an explicit remove keeps a stale file out of the
        # record whatever the runner does (D-403).
        run: rm -f "${RUNNER_TEMP}/bot-deaths.txt"
      - name: Plan the seeds
        # D-564 to D-567: the UTC date of the night start selects the slice of every step. The record of main names the
        # failed seeds that this night carries, and each step appends the failure line of its sweep to one file, which
        # the record step reads. A night on a branch carries the seeds of main too, so its promotion proves them (D-569).
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/seed-failures.txt"
          echo "NIGHT_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          git fetch --quiet origin refs/heads/night-results
          git show FETCH_HEAD:night.json > "${RUNNER_TEMP}/main-night.json"
      - name: Random walker, the fixed seeds and the slice
        shell: bash
        run: |
          set -euo pipefail
          seeds=$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep random-walker --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json")
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy random-walker --seeds "$seeds" --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt" --failures "${RUNNER_TEMP}/seed-failures.txt"
      - name: Greedy descender, the fixed seeds and the slice
        shell: bash
        run: |
          set -euo pipefail
          seeds=$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep greedy-descender --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json")
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy greedy-descender --seeds "$seeds" --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt" --failures "${RUNNER_TEMP}/seed-failures.txt"
      - name: Full clearer, the fixed seeds and the slice
        shell: bash
        run: |
          set -euo pipefail
          seeds=$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep full-clearer --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json")
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy full-clearer --seeds "$seeds" --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt" --failures "${RUNNER_TEMP}/seed-failures.txt"
      - name: Timer tester, the fixed seeds and the slice
        # D-426: the tester waits through each expiry, so every run lasts at least three minutes of simulated time.
        shell: bash
        run: |
          set -euo pipefail
          seeds=$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep timer-tester --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json")
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy timer-tester --seeds "$seeds" --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt" --failures "${RUNNER_TEMP}/seed-failures.txt"
      - name: Coward, the fixed seeds and the slice
        # D-434: the coward ascends at the first stairwell, so each run lasts one floor.
        shell: bash
        run: |
          set -euo pipefail
          seeds=$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep coward --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json")
          dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- bot-run --policy coward --seeds "$seeds" --output bot-logs --root . --summary "${RUNNER_TEMP}/bot-deaths.txt" --failures "${RUNNER_TEMP}/seed-failures.txt"
      - name: Reachability sweep, the fixed seeds and the slice
        shell: bash
        env:
          WYC_NIGHT_SWEEP: "1"
          WYC_NIGHT_FAILURES: ${{ runner.temp }}/seed-failures.txt
        run: |
          set -euo pipefail
          WYC_NIGHT_SEEDS=$(dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-seeds --sweep reachability --date "$NIGHT_DATE" --root . --carry "${RUNNER_TEMP}/main-night.json")
          export WYC_NIGHT_SEEDS
          dotnet test WhatYouCarry.slnx --no-build --filter "FullyQualifiedName~EveryChamberReachable|FullyQualifiedName~DetailKeepsEveryChamberReachable"
      - name: Keep the bot logs of a failed night
        # The crash text of a failed run lives in its log alone, and the next job on the runner cleans the directory (D-280).
        # A night that fails before the bot steps has no logs, and the step says so instead of failing in silence.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: bot-logs
          if-no-files-found: warn
      - name: Write the night record
        if: always() && startsWith(github.ref, 'refs/heads/')
        run: dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-record --commit "${GITHUB_SHA}" --status "${{ job.status }}" --output "${RUNNER_TEMP}/night.json" --summary "${RUNNER_TEMP}/bot-deaths.txt" --date "${NIGHT_DATE}" --failures "${RUNNER_TEMP}/seed-failures.txt" --carry "${RUNNER_TEMP}/main-night.json"
      - name: Publish the night record
        if: always() && startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          # Only main writes the record that every PR reads (D-373). Another branch writes a record of its own (D-538).
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            target="night-results"
          else
            target="night-branch/${GITHUB_REF_NAME}"
          fi
          # A broken build leaves no binary for night-record, and the plan step did not run. A script writes the failure
          # record, and it keeps the failed seeds of the record of main, so the carry survives (D-567, PR #100 review P1-1).
          if [ ! -f "${RUNNER_TEMP}/night.json" ]; then
            git fetch --quiet origin refs/heads/night-results
            git show FETCH_HEAD:night.json > "${RUNNER_TEMP}/main-night-now.json"
            bash .github/scripts/night-failure-record.sh "${GITHUB_SHA}" "${RUNNER_TEMP}/main-night-now.json" "${RUNNER_TEMP}/night.json"
          fi
          if [ "$target" = "night-results" ]; then
            # The lease: the record of main as this step reads it. A promotion that writes in between fails the push.
            lease=$(git ls-remote origin refs/heads/night-results | cut -f1)
            # A promotion can write a record at a later merge commit while the night runs, and that record stays (D-562).
            if [ "$BUILD_OUTCOME" = "success" ]; then
              git fetch --quiet origin main
              set +e
              dotnet run --project WhatYouCarry.Tools/WhatYouCarry.Tools.csproj --no-build -- night-publish-check --root . --remote origin --commit "${GITHUB_SHA}"
              rc=$?
              set -e
              if [ "$rc" -eq 1 ]; then
                echo "This night writes no record. Its result stays in this run."
                exit 0
              fi
              if [ "$rc" -ne 0 ]; then
                echo "The night-publish-check command exited ${rc}."
                exit "$rc"
              fi
            else
              echo "The build left no binary for the order check, so the failure record of this night replaces the record of main."
            fi
          fi
          work="${RUNNER_TEMP}/night-results"
          rm -rf "$work"
          git worktree add --detach "$work" HEAD
          cd "$work"
          git checkout --orphan "$target"
          git rm -rfq .
          cp "${RUNNER_TEMP}/night.json" night.json
          git config user.name "night job"
          git config user.email "night-job@users.noreply.github.com"
          git add night.json
          git commit -qm "night: ${GITHUB_SHA} ${{ job.status }}"
          if [ "$target" = "night-results" ]; then
            git push --force-with-lease="refs/heads/night-results:${lease}" origin "HEAD:refs/heads/${target}"
          else
            git push --force origin "HEAD:refs/heads/${target}"
          fi
      - name: Re-run the night gate of the branch
        # The night-gate check of a PR runs on a pull_request event, so a night that ends later re-runs its newest run
        # (D-548). A run that has not ended reads the new record when it runs. A branch with no PR has no such run.
        if: always() && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow night-gate.yml --branch "$GITHUB_REF_NAME" --event pull_request --limit 1 --json databaseId,status --jq '.[] | "\(.databaseId) \(.status)"')
          if [ -z "$run" ]; then
            echo "The branch ${GITHUB_REF_NAME} has no night-gate run, so no PR check reads this record yet."
            exit 0
          fi
          id="${run%% *}"
          state="${run#* }"
          if [ "$state" != "completed" ]; then
            echo "The night-gate run ${id} is ${state}, so it reads the new record when it runs."
            exit 0
          fi
          gh run rerun "$id" --repo "$GITHUB_REPOSITORY"
          echo "The night-gate run ${id} runs again, and it reads the record of this night."
      - name: Re-run the night gate of each open PR
        # Every PR reads the record of main, so a night on main re-runs the newest night-gate run of each open PR (D-559).
        if: always() && github.ref == 'refs/heads/main'
        uses: ./.github/actions/rerun-night-gates
